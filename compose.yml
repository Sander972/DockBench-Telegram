services:
  telegram:
    image: ghcr.io/sander972/dockbench-telegram:latest
    container_name: dockbench-telegram
    init: true
    # cores this container may run on; the dashboard sets 1-(N-1) so core 0 stays free for the host, empty means every core
    cpuset: ${CPUSET:-}
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_GROUP_ID: ${TELEGRAM_GROUP_ID:-}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-}
      # read-only Docker access: everything the bot does in a dev container goes to that container's dockbench-agent
      DOCKER_HOST: tcp://docker-proxy:2375
    volumes:
      - state:/data
    networks:
      - devnet
      - telegram-docker
    depends_on:
      - docker-proxy
    restart: unless-stopped

  # GET only: container lists, events and file reads, never exec or create; only the bot can reach it, never put it on devnet
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: dockbench-telegram-docker
    cpuset: ${CPUSET:-}
    environment:
      CONTAINERS: 1
      EVENTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - telegram-docker
    restart: unless-stopped

volumes:
  state:

networks:
  devnet:
    external: true
  telegram-docker:
    internal: true
